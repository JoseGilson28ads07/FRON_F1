<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Pit Lane F1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina-form">
    <!-- Sem JavaScript e sem backend: os campos não têm o atributo "name", então nenhum dado é enviado.
         O botão apenas leva o usuário para a próxima página. Os "required" e type="email" validam o preenchimento. -->
    <form class="form" action="index.html">
      <p class="logo">PIT LANE <span>F1</span></p>
      <h1>Entrar</h1>
      <p class="aviso">Demonstração de interface: não há autenticação real.</p>
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="voce@email.com" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" required>
      <button class="btn" type="submit">Entrar</button>
      <p class="links"><a href="#">Esqueci minha senha</a><br>
      Não tem conta? <a href="cadastro.html">Criar conta</a><br><a href="index.html">← Voltar ao site</a></p>
    </form>
  </main>
</body>
</html>
